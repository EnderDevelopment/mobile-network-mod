buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://files.minecraftforge.net/maven"
        }
        maven {
            name = "minecraft"
            url = "https://libraries.minecraft.net/"
        }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.3-SNAPSHOT"
    }
}

apply plugin: "net.minecraftforge.gradle.forge"

version = "1.0"
group = "com.nikolairusskih167"
archivesBaseName = "mobilenetworkmod"

minecraft {
    version = "1.12.2-14.23.5.2860"
    runDir = "run"

    runs {
        client {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
        }
        server {
            workingDirectory project.file("run")
            property "forge.logging.markers", "REGISTRIES"
        }
        data {
            workingDirectory project.file("run")
            args "--mod", "mobilenetworkmod", "--all", "--output", "src/main/resources/assets/mobilenetworkmod/"
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = "forge"
        url = "https://files.minecraftforge.net/maven"
    }
    maven {
        name = "minecraft"
        url = "https://libraries.minecraft.net/"
    }
}

dependencies {
    compile "net.minecraftforge:forge:1.12.2-14.23.5.2860"
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version
}
